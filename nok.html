<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro-Budget & Cash Flow Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-12">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-lg">
                    <i data-lucide="wallet" class="w-6 h-6"></i>
                </div>
                <h1 class="font-bold text-lg text-slate-100 tracking-tight">MicroBudget</h1>
            </div>
            <button onclick="resetAllData()" class="text-xs text-slate-400 hover:text-rose-400 flex items-center gap-1 transition">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-6 space-y-6">

        <!-- Stat Cards Grid -->
        <section class="grid grid-cols-2 gap-3">
            <!-- Total Monthly Budget -->
            <div class="col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm relative overflow-hidden">
                <div class="flex items-center justify-between text-xs font-medium text-slate-400 mb-1">
                    <span>Monthly Budget</span>
                    <button onclick="editBudget()" class="text-emerald-400 hover:underline">Edit</button>
                </div>
                <div class="flex items-baseline space-x-1">
                    <span class="text-xs text-slate-400">₦</span>
                    <span id="monthlyBudgetDisplay" class="text-2xl font-bold text-slate-100">0</span>
                </div>
            </div>

            <!-- Safe Daily Limit -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <div class="flex items-center space-x-1.5 text-xs text-emerald-400 font-medium mb-1">
                    <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
                    <span>Safe Daily Limit</span>
                </div>
                <div class="flex items-baseline space-x-0.5">
                    <span class="text-xs text-slate-400">₦</span>
                    <span id="safeDailyDisplay" class="text-xl font-bold text-emerald-400">0</span>
                </div>
                <p id="daysRemainingText" class="text-[10px] text-slate-500 mt-1">0 days remaining</p>
            </div>

            <!-- Spent Today -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <div class="flex items-center space-x-1.5 text-xs text-amber-400 font-medium mb-1">
                    <i data-lucide="trending-up" class="w-3.5 h-3.5"></i>
                    <span>Spent Today</span>
                </div>
                <div class="flex items-baseline space-x-0.5">
                    <span class="text-xs text-slate-400">₦</span>
                    <span id="spentTodayDisplay" class="text-xl font-bold text-amber-400">0</span>
                </div>
                <p id="totalSpentMonthText" class="text-[10px] text-slate-500 mt-1">Total Month: ₦0</p>
            </div>
        </section>

        <!-- Quick Add Expense Form -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-sm space-y-4">
            <h2 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i> Log New Expense
            </h2>
            <form id="expenseForm" onsubmit="addExpense(event)" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Amount (₦)</label>
                        <input type="number" id="expenseAmount" placeholder="0" required min="1"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 text-sm focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Category</label>
                        <select id="expenseCategory" required
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 text-sm focus:outline-none focus:border-emerald-500 transition">
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Airtime/Data">Airtime/Data</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Description (Optional)</label>
                    <input type="text" id="expenseDesc" placeholder="e.g., Lunch, Bus fare"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 text-sm focus:outline-none focus:border-emerald-500 transition">
                </div>
                <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm py-2.5 rounded-xl transition shadow-lg shadow-emerald-900/30 flex items-center justify-center gap-2">
                    <i data-lucide="check" class="w-4 h-4"></i> Add Expense
                </button>
            </form>
        </section>

        <!-- Category Spending Envelopes -->
        <section class="space-y-3">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Category Breakdown</h2>
            <div id="categoryEnvelopes" class="space-y-2">
                <!-- Dynamic Envelopes Injected Here -->
            </div>
        </section>

        <!-- Recent Transactions -->
        <section class="space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Recent Transactions</h2>
                <span id="txCount" class="text-xs text-slate-500">0 logged</span>
            </div>
            <div id="transactionList" class="space-y-2">
                <!-- Dynamic Transactions Injected Here -->
            </div>
        </section>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // State Initialization
        let appState = {
            monthlyBudget: parseFloat(localStorage.getItem('mb_budget')) || 50000,
            expenses: JSON.parse(localStorage.getItem('mb_expenses')) || []
        };

        const categories = ['Food', 'Transport', 'Airtime/Data', 'Bills', 'Other'];

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderApp();
        });

        function saveState() {
            localStorage.setItem('mb_budget', appState.monthlyBudget);
            localStorage.setItem('mb_expenses', JSON.stringify(appState.expenses));
        }

        function editBudget() {
            const newBudget = prompt("Enter your total monthly budget (₦):", appState.monthlyBudget);
            if (newBudget !== null && !isNaN(newBudget) && parseFloat(newBudget) >= 0) {
                appState.monthlyBudget = parseFloat(newBudget);
                saveState();
                renderApp();
            }
        }

        function addExpense(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const category = document.getElementById('expenseCategory').value;
            const description = document.getElementById('expenseDesc').value.trim() || category;

            if (!amount || amount <= 0) return;

            const newExpense = {
                id: Date.now(),
                amount,
                category,
                description,
                date: new Date().toISOString()
            };

            appState.expenses.unshift(newExpense);
            saveState();
            renderApp();

            // Reset form
            document.getElementById('expenseForm').reset();
        }

        function deleteExpense(id) {
            appState.expenses = appState.expenses.filter(item => item.id !== id);
            saveState();
            renderApp();
        }

        function resetAllData() {
            if (confirm("Are you sure you want to reset all budget and expense data?")) {
                localStorage.removeItem('mb_budget');
                localStorage.removeItem('mb_expenses');
                appState.monthlyBudget = 50000;
                appState.expenses = [];
                renderApp();
            }
        }

        function getDaysRemainingInMonth() {
            const now = new Date();
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            return (lastDay - now.getDate()) + 1; // including today
        }

        function formatCurrency(num) {
            return num.toLocaleString('en-NG', { maximumFractionDigits: 0 });
        }

        function renderApp() {
            const now = new Date();
            const todayStr = now.toDateString();

            // Calculations
            const totalSpent = appState.expenses.reduce((acc, curr) => acc + curr.amount, 0);
            const spentToday = appState.expenses
                .filter(item => new Date(item.date).toDateString() === todayStr)
                .reduce((acc, curr) => acc + curr.amount, 0);

            const remainingBudget = Math.max(0, appState.monthlyBudget - totalSpent);
            const daysRemaining = getDaysRemainingInMonth();
            const safeDaily = daysRemaining > 0 ? (remainingBudget / daysRemaining) : 0;

            // Render Header Displays
            document.getElementById('monthlyBudgetDisplay').innerText = formatCurrency(appState.monthlyBudget);
            document.getElementById('safeDailyDisplay').innerText = formatCurrency(safeDaily);
            document.getElementById('spentTodayDisplay').innerText = formatCurrency(spentToday);
            document.getElementById('daysRemainingText').innerText = `${daysRemaining} days left in month`;
            document.getElementById('totalSpentMonthText').innerText = `Total Month: ₦${formatCurrency(totalSpent)}`;

            // Render Envelopes Breakdown
            const envelopesContainer = document.getElementById('categoryEnvelopes');
            envelopesContainer.innerHTML = '';

            categories.forEach(cat => {
                const catSpent = appState.expenses
                    .filter(item => item.category === cat)
                    .reduce((acc, curr) => acc + curr.amount, 0);

                const percentage = appState.monthlyBudget > 0 ? Math.min(100, (catSpent / appState.monthlyBudget) * 100) : 0;

                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1.5';
                card.innerHTML = `
                    <div class="flex items-center justify-between text-xs">
                        <span class="font-medium text-slate-300">${cat}</span>
                        <span class="text-slate-400">₦${formatCurrency(catSpent)}</span>
                    </div>
                    <div class="w-full bg-slate-950 rounded-full h-1.5 overflow-hidden">
                        <div class="bg-emerald-500 h-1.5 rounded-full transition-all duration-300" style="width: ${percentage}%"></div>
                    </div>
                `;
                envelopesContainer.appendChild(card);
            });

            // Render Transactions List
            const txContainer = document.getElementById('transactionList');
            document.getElementById('txCount').innerText = `${appState.expenses.length} logged`;
            txContainer.innerHTML = '';

            if (appState.expenses.length === 0) {
                txContainer.innerHTML = `
                    <div class="text-center py-6 text-slate-500 text-xs">
                        No transactions logged yet. Add one above!
                    </div>
                `;
            } else {
                appState.expenses.slice(0, 10).forEach(tx => {
                    const txDate = new Date(tx.date);
                    const formattedDate = txDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

                    const div = document.createElement('div');
                    div.className = 'bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between group hover:border-slate-700 transition';
                    div.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <div class="p-2 bg-slate-800 rounded-lg text-slate-300 text-xs font-semibold uppercase">
                                ${tx.category.substring(0, 2)}
                            </div>
                            <div>
                                <p class="text-xs font-medium text-slate-200">${tx.description}</p>
                                <p class="text-[10px] text-slate-500">${tx.category} • ${formattedDate}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-xs font-bold text-rose-400">-₦${formatCurrency(tx.amount)}</span>
                            <button onclick="deleteExpense(${tx.id})" class="text-slate-600 hover:text-rose-400 transition">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    `;
                    txContainer.appendChild(div);
                });
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
